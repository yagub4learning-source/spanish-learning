<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173f39">
  <title>Аудиоистории · Испанский через истории</title>
  <style>
    :root{color-scheme:light;--green:#173f39;--paper:#f6f3ec;--card:#fffefa;--muted:#66745e;--line:#dfe5d6}
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:#233c39;font:16px/1.6 system-ui,sans-serif;padding-bottom:40px}
    header{padding:44px max(6vw,24px);background:var(--green);color:#faf6ea}
    .header-links{display:flex;flex-wrap:wrap;gap:16px}
    .header-links a{color:#d7e1d7;text-decoration:none;font-size:14px}
    .header-links a:hover{text-decoration:underline}
    h1{font:clamp(34px,5vw,56px)/1.1 Georgia,serif;margin:18px 0 8px}
    header p{margin:0;color:#d7e1d7}
    main{max-width:980px;margin:0 auto;padding:36px 22px 64px}
    .layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;align-items:start}
    nav{position:sticky;top:20px;display:grid;gap:10px}
    nav strong{font-size:12px;letter-spacing:.12em;color:var(--muted);margin:0 4px 3px}
    .story-choice{width:100%;padding:15px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:inherit;text-align:left;font:inherit;cursor:pointer;transition:background .15s,border-color .15s,transform .15s}
    .story-choice:hover{border-color:#9aaf92;transform:translateY(-1px)}
    .story-choice[aria-pressed="true"]{background:#e3ecdf;border-color:#9aaf92;box-shadow:inset 4px 0 #286054}
    .story-choice span{display:block;font-size:12px;color:var(--muted);margin-top:3px}
    .player{min-height:300px;padding:clamp(24px,5vw,48px);border:1px solid #e2e4d9;border-radius:22px;background:var(--card);box-shadow:0 8px 25px #233c3905}
    .eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--muted)}
    h2{font:clamp(28px,4vw,38px)/1.2 Georgia,serif;margin:12px 0 34px}
    .player-controls{display:grid;grid-template-columns:auto minmax(140px,1fr) auto;align-items:center;gap:22px}
    .transport{display:flex;align-items:center;gap:10px}
    .transport button{position:relative;display:grid;place-items:center;width:44px;height:44px;padding:0;border:1px solid #ccd6c4;border-radius:50%;background:#edf2e7;color:#173f39;font:600 18px system-ui;cursor:pointer;touch-action:manipulation}
    .transport button:hover{background:#e2e9db}
    .transport .toggle{width:50px;height:50px;border:0;border-radius:16px;background:var(--green);color:#fffefa;font-size:21px}
    .transport .toggle:hover{background:#286054}
    .transport .skip svg{display:block;width:30px;height:30px}
    .transport button:focus-visible,.speed-control select:focus-visible,.seek input:focus-visible,.story-choice:focus-visible,header a:focus-visible{outline:3px solid #cf8e37;outline-offset:3px}
    .seek{display:grid;grid-template-columns:40px minmax(70px,1fr) 40px;align-items:center;gap:8px;font:12px/1 system-ui;font-variant-numeric:tabular-nums;color:#52605a}
    .seek span:last-child{text-align:right}
    .seek input{width:100%;min-width:0;height:24px;margin:0;padding:0;border:0;background:transparent;accent-color:var(--green);touch-action:pan-x}
    .seek input:disabled{opacity:.45}
    .speed-control{display:flex;align-items:center;gap:8px;white-space:nowrap;font:600 12px system-ui;color:#52605a}
    .speed-control select{padding:9px 10px;border:1px solid #ccd6c4;border-radius:9px;background:var(--card);color:#233c39;font:600 14px system-ui;cursor:pointer}
    .hint{margin:26px 0 0;color:var(--muted);font-size:14px}
    audio{display:none}
    @media(max-width:760px){header{padding:32px 22px}main{padding:24px 14px}.layout{grid-template-columns:1fr;gap:18px}nav{position:static;grid-template-columns:repeat(2,minmax(0,1fr))}nav strong{grid-column:1/-1}.story-choice{padding:12px}.player{min-height:auto}.player-controls{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto;gap:8px}.seek{grid-column:1;grid-row:1;grid-template-columns:40px minmax(0,1fr) 40px}.transport{grid-column:1;grid-row:2;justify-content:center;gap:16px}.speed-control{grid-column:1;grid-row:3;justify-self:center;font-size:11px}.speed-control select{padding:8px}.hint{margin-top:20px}}
  </style>
</head>
<body>
  <header>
    <div class="header-links"><a href="./">← Обычные истории</a><a href="phrases.html">💬 Фразы на каждый день</a></div>
    <h1>Аудиоистории</h1>
    <p>Выбери запись и слушай.</p>
  </header>
  <main>
    <div class="layout">
      <nav aria-label="Выбор аудиоистории" id="story-list"><strong>ВЫБЕРИ ИСТОРИЮ</strong></nav>
      <section class="player" aria-live="polite">
        <div class="eyebrow" id="story-label">АУДИОИСТОРИЯ 01</div>
        <h2 id="story-title">История 1</h2>
        <div class="player-controls">
          <div class="transport">
            <button class="skip" id="back" type="button" aria-label="Назад на 3 секунды"><svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8a11 11 0 1 1-2 12"/><path d="M7 3v5h5"/></g><text x="16" y="20.5" text-anchor="middle" fill="currentColor" font-family="system-ui,sans-serif" font-size="13" font-weight="650">3</text></svg></button>
            <button class="toggle" id="toggle" type="button" aria-label="Воспроизвести">▶</button>
            <button class="skip" id="forward" type="button" aria-label="Вперёд на 3 секунды"><svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true" focusable="false"><g transform="translate(32 0) scale(-1 1)" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8a11 11 0 1 1-2 12"/><path d="M7 3v5h5"/></g><text x="16" y="20.5" text-anchor="middle" fill="currentColor" font-family="system-ui,sans-serif" font-size="13" font-weight="650">3</text></svg></button>
          </div>
          <div class="seek"><span id="elapsed">0:00</span><input id="seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="Позиция воспроизведения" disabled><span id="duration">0:00</span></div>
          <label class="speed-control" for="speed">Скорость<select id="speed" aria-label="Скорость воспроизведения"><option value="0.5">0,5×</option><option value="0.75">0,75×</option><option value="1" selected>1×</option><option value="1.25">1,25×</option><option value="1.5">1,5×</option><option value="1.75">1,75×</option><option value="2">2×</option></select></label>
        </div>
        <p class="hint">Испанская фраза звучит вместе с переводом на русский.</p>
        <audio id="audio-player" preload="metadata" aria-label="Аудиоистория 1"></audio>
      </section>
    </div>
  </main>
  <script>
    (() => {
      const stories = Array.from({length: 6}, (_, i) => ({title: `История ${i + 1}`, src: `audio-stories/story-${String(i + 1).padStart(2, '0')}.mp3`}));
      const list = document.getElementById('story-list');
      const player = document.getElementById('audio-player');
      const title = document.getElementById('story-title');
      const label = document.getElementById('story-label');
      const toggle = document.getElementById('toggle');
      const seek = document.getElementById('seek');
      const elapsed = document.getElementById('elapsed');
      const duration = document.getElementById('duration');
      const speed = document.getElementById('speed');
      const storageKey = 'spanish-story-playback-rate';
      const savedRate = localStorage.getItem(storageKey);
      if (savedRate && [...speed.options].some(option => option.value === savedRate)) speed.value = savedRate;
      player.playbackRate = Number(speed.value);
      const format = value => { const seconds = Number.isFinite(value) ? Math.floor(value) : 0; return Math.floor(seconds / 60) + ':' + String(seconds % 60).padStart(2, '0'); };
      const refresh = () => {
        const ready = Number.isFinite(player.duration) && player.duration > 0;
        seek.disabled = !ready;
        seek.max = ready ? player.duration : 100;
        seek.value = ready ? player.currentTime : 0;
        elapsed.textContent = format(player.currentTime);
        duration.textContent = format(player.duration);
        toggle.textContent = player.paused ? '▶' : 'Ⅱ';
        toggle.setAttribute('aria-label', player.paused ? 'Воспроизвести' : 'Пауза');
      };
      const playCurrent = () => player.play().catch(() => {});
      const selectStory = (story, index, autoplay = true) => {
        player.pause();
        player.src = story.src;
        player.setAttribute('aria-label', `Аудио ${story.title.toLowerCase()}`);
        title.textContent = story.title;
        label.textContent = `АУДИОИСТОРИЯ ${String(index + 1).padStart(2, '0')}`;
        list.querySelectorAll('.story-choice').forEach((item, itemIndex) => item.setAttribute('aria-pressed', String(index === itemIndex)));
        player.load();
        if (autoplay) playCurrent();
        refresh();
      };
      stories.forEach((story, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'story-choice';
        button.setAttribute('aria-pressed', 'false');
        button.innerHTML = `${story.title}<span>Испанский · русский</span>`;
        button.addEventListener('click', () => selectStory(story, index));
        list.append(button);
      });
      toggle.addEventListener('click', () => player.paused ? playCurrent() : player.pause());
      const skip = seconds => { if (Number.isFinite(player.duration)) player.currentTime = Math.max(0, Math.min(player.duration, player.currentTime + seconds)); refresh(); };
      document.getElementById('back').addEventListener('click', () => skip(-3));
      document.getElementById('forward').addEventListener('click', () => skip(3));
      seek.addEventListener('input', () => { if (Number.isFinite(player.duration)) player.currentTime = Number(seek.value); refresh(); });
      speed.addEventListener('change', () => { player.playbackRate = Number(speed.value); localStorage.setItem(storageKey, speed.value); });
      ['play','pause','ended','timeupdate','loadedmetadata','durationchange','emptied'].forEach(event => player.addEventListener(event, refresh));
      selectStory(stories[0], 0, false);
    })();
  </script>
</body>
</html>
