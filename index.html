@media(max-width:650px){
 body{padding-bottom:calc(120px + env(safe-area-inset-bottom))}

.sentence-play{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;margin-right:10px;border:1px solid #b7c8a6;border-radius:50%;background:#fffefa;color:#245e4d;cursor:pointer;vertical-align:middle;font:14px system-ui}.sentence-play:focus-visible{outline:2px solid #cf8e37;outline-offset:3px}.sentence-audio-error{display:block;font:13px system-ui;color:#8a3429}@media print{.sentence-play{display:none}}</style></head><body><header><h1>Spanish stories</h1></header><div class="layout"><nav aria-label="Навигация по рассказам" id="story-nav"></nav><main id="stories"><p role="status">Загрузка историй…</p></main></div><section class="player-dock" aria-label="Аудиоплеер рассказов"><div><div class="player-caption">СЛУШАЙ И ЧИТАЙ</div><div class="player-title" id="player-title" lang="es-ES"></div><p class="player-note" id="player-note" role="status"></p></div><audio id="fixed-audio" controls preload="none" aria-label="Аудио выбранного рассказа"></audio></section>
<script>
(async () => {
try {
const dockPlayer = document.getElementById('fixed-audio');
const title = document.getElementById('player-title');
const note = document.getElementById('player-note');
const main = document.getElementById('stories');

let stories = [], activeStory = -1;
const sentencePlayer = new Audio();
let sentencePlayButton = null;
function stopSentenceAudio() {
  sentencePlayer.pause();
  if (sentencePlayButton) {
    sentencePlayButton.textContent = '▶';
    sentencePlayButton.setAttribute('aria-label', 'Слушать предложение');
    sentencePlayButton.setAttribute('aria-pressed', 'false');
  }
  sentencePlayButton = null;
}
sentencePlayer.addEventListener('ended', stopSentenceAudio);
dockPlayer.addEventListener('play', stopSentenceAudio);

const escapeHTML = value => String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
function selectStory(index) {
  if (activeStory === index) return;
  activeStory = index;
  dockPlayer.pause();
  dockPlayer.src = stories[index].audio.src;
  title.textContent = stories[index].title;
  dockPlayer.setAttribute('aria-label', title.textContent);
  dockPlayer.load();
  note.textContent = '';
  updateButtons();
}
function updateButtons() {
  document.querySelectorAll('.story-play:not(:disabled)').forEach(button => {
    const playing = Number(button.dataset.story) === activeStory && !dockPlayer.paused;
    button.textContent = playing ? 'Ⅱ Пауза' : '▶ ' + (button.dataset.playLabel || (stories[Number(button.dataset.story)].audio.src === 'numbers.mp3' ? 'Слушать числа' : 'Слушать рассказ'));
    button.setAttribute('aria-label', playing ? 'Пауза' : (button.dataset.playLabel || 'Слушать рассказ'));
  });
}
function render(data) {
  if (!Array.isArray(data) || !data.length || data.some(s => !s.title || !Array.isArray(s.es) || !Array.isArray(s.sentences) || !Array.isArray(s.vocab) || !s.audio)) throw new Error('Invalid stories');
  dockPlayer.pause(); activeStory = -1; stories = data;
  document.getElementById('story-nav').innerHTML = '<strong>ВЫБЕРИ ИСТОРИЮ</strong>' + stories.map((s,i) => `<a href="#story-${i+1}"><span class="eyebrow">${String(i+3).padStart(2,'0')} · ${escapeHTML(s.level)}</span><br><span lang="es-ES">${escapeHTML(s.title)}</span></a>`).join('');
  main.innerHTML = stories.map((s,i) => {
    const turns = s.dialogue_turns || [];
    const translationId = `translation-${i}`;
    const sentenceHTML = index => {
      const pair = s.sentences[index];
      return `<span role="button" tabindex="0" class="sentence-toggle" lang="es-ES" data-sentence-audio="${escapeHTML(pair.audio || '')}" data-translation="${escapeHTML(pair.ru)}" aria-expanded="false" aria-controls="${translationId}" title="Нажми, чтобы увидеть перевод">${escapeHTML(pair.es)}</span>`;
    };
    let cursor = 0, chunks = [];
    while (cursor < s.sentences.length) {
      const turn = turns.find(([start]) => start === cursor);
      if (turn) {
        const indices = Array.from({length:turn[1]-turn[0]+1}, (_, offset) => cursor+offset);
        chunks.push('<span class="dialogue-turn">' + indices.map(sentenceHTML).join(' ') + '</span>');
        cursor = turn[1]+1;
      } else {
        chunks.push(sentenceHTML(cursor++));
      }
    }
    const paragraphs = '<div class="sentence-paragraph"><p class="flowing-paragraph">' + chunks.join(' ') + `</p><span id="${translationId}" class="sentence-translation" lang="ru" aria-live="polite" hidden></span></div>`;
    return `<article id="story-${i+1}"><div class="eyebrow">ИСТОРИЯ ${String(i+3).padStart(2,'0')} · ${escapeHTML(s.level)}</div><h2 lang="es-ES">${escapeHTML(s.title)}</h2><button class="story-play" type="button" data-story="${i}" ${s.audio.available ? '' : 'disabled'}>${s.audio.available ? '▶ Слушать рассказ' : 'Аудио скоро'}</button><p class="reading-tip">Нажми на предложение, чтобы увидеть перевод. Нажми ещё раз, чтобы скрыть.</p><div class="spanish" lang="es-ES">${paragraphs}</div></article>`;
  }).join('');
  const first = stories.findIndex(s => s.audio.available);
  if (first >= 0) selectStory(first);
}
function positionTranslation(sentence, translation) {
  const paragraph = sentence.closest('.sentence-paragraph');
  const bounds = paragraph.getBoundingClientRect();
  const lines = sentence.getClientRects();
  const lastLine = lines[lines.length - 1];
  translation.style.top = `${lastLine.bottom - bounds.top + 6}px`;
  translation.style.left = '0px';
}
window.addEventListener('resize', () => {
  document.querySelectorAll('.sentence-toggle[aria-expanded="true"]').forEach(sentence => {
    positionTranslation(sentence, sentence.closest('.sentence-paragraph').querySelector('.sentence-translation'));
  });
});
main.addEventListener('keydown', event => {
  if (event.key === 'Escape') {
    stopSentenceAudio();
    main.querySelectorAll('.sentence-translation').forEach(item => item.hidden = true);
    main.querySelectorAll('.sentence-toggle').forEach(item => item.setAttribute('aria-expanded', 'false'));
  }
});
main.addEventListener('keydown', event => {
  if ((event.key === 'Enter' || event.key === ' ') && event.target.matches('.sentence-toggle')) {
    event.preventDefault();
    event.target.click();
  }
});
main.addEventListener('click', async event => {
  const clipButton = event.target.closest('.sentence-play');
  if (clipButton) {
    const wasPlaying = sentencePlayButton === clipButton && !sentencePlayer.paused;
    stopSentenceAudio();
    if (wasPlaying) return;
    dockPlayer.pause();
    sentencePlayButton = clipButton;
    sentencePlayer.src = clipButton.dataset.src;
    clipButton.textContent = 'Ⅱ';
    clipButton.setAttribute('aria-label', 'Пауза');
    clipButton.setAttribute('aria-pressed', 'true');
    const popup = clipButton.closest('.sentence-translation');
    popup.querySelector('.sentence-audio-error')?.remove();
    try { await sentencePlayer.play(); }
    catch (error) {
      if (sentencePlayButton !== clipButton) return;
      stopSentenceAudio();
      const message = document.createElement('span');
      message.className = 'sentence-audio-error';
      message.setAttribute('role', 'status');
      message.textContent = 'Не удалось включить аудио. Попробуй ещё раз.';
      popup.append(message);
    }
    return;
  }
  const sentence = event.target.closest('.sentence-toggle');
  if (sentence) {
    const paragraph = sentence.closest('.sentence-paragraph');
    const translation = paragraph.querySelector('.sentence-translation');
    const shouldOpen = sentence.getAttribute('aria-expanded') !== 'true';
    paragraph.querySelectorAll('.sentence-toggle').forEach(item => item.setAttribute('aria-expanded', 'false'));
    sentence.setAttribute('aria-expanded', String(shouldOpen));
    stopSentenceAudio();
    translation.replaceChildren();
    if (shouldOpen) {
      if (sentence.dataset.sentenceAudio) {
        const play = document.createElement('button');
        play.type = 'button';
        play.className = 'sentence-play';
        play.dataset.src = sentence.dataset.sentenceAudio;
        play.textContent = '▶';
        play.setAttribute('aria-label', 'Слушать предложение');
        play.setAttribute('aria-pressed', 'false');
        translation.append(play);
      }
      translation.append(document.createTextNode(sentence.dataset.translation));
    }
    
    translation.hidden = !shouldOpen;
    if (shouldOpen) positionTranslation(sentence, translation);
    return;
  }
  const button = event.target.closest('.story-play:not(:disabled)');
  if (!button) return;
  selectStory(Number(button.dataset.story));
  if (dockPlayer.paused) dockPlayer.play().catch(() => { note.textContent = 'Нажми воспроизведение в нижнем плеере.'; });
  else dockPlayer.pause();
});
['play','pause','ended'].forEach(event => dockPlayer.addEventListener(event, updateButtons));
dockPlayer.addEventListener('error', () => { note.textContent = 'Аудиофайл пока недоступен.'; });

function renderNumbers() {
  stories.push(content.numbers);
  const word = n => content.numbers.entries[n-1];
  const groups = Array.from({length:10}, (_,group) => {
    const start = group*10+1;
    const rows = Array.from({length:10}, (_,offset) => {
      const n = start+offset;
      return `<tr><td>${n}</td><td lang="es-ES">${word(n)}</td></tr>`;
    }).join('');
    return `<div class="number-group"><table><caption>${start}–${start+9}</caption><thead><tr><th scope="col">ЧИСЛО</th><th scope="col">ESPAÑOL</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }).join('');
  main.insertAdjacentHTML('beforeend', `<article id="numbers"><div class="eyebrow">РАЗДЕЛ 01 · A1</div><h2 lang="es-ES">Los números: 1–100</h2><button class="story-play" type="button" data-story="${stories.length-1}" aria-label="Слушать числа">▶ Слушать числа</button><p class="numbers-intro">Числа от 1 до 100 · Цифра слева, написание по-испански справа.</p><div class="number-groups">${groups}</div></article>`);
  document.getElementById('story-nav').insertAdjacentHTML('beforeend', '<a href="#numbers"><span class="eyebrow">01 · A1</span><br><span lang="es-ES">Los números: 1–100</span></a>');
}


function renderCalendar() {
  const monthsAudioIndex = stories.length;
  stories.push(content.calendar.months);
  const weekdaysAudioIndex = stories.length;
  stories.push(content.calendar.weekdays);
  const months = content.calendar.months.entries;
  const weekdays = content.calendar.weekdays.entries;
  const table = (caption, entries) => `<div class="calendar-group"><table><caption lang="es-ES">${caption}</caption><thead><tr><th scope="col">ESPAÑOL</th><th scope="col">РУССКИЙ</th></tr></thead><tbody>${entries.map(([es,ru]) => `<tr><td lang="es-ES">${es}</td><td lang="ru">${ru}</td></tr>`).join('')}</tbody></table></div>`;
  main.insertAdjacentHTML('beforeend', `<article id="calendar"><div class="eyebrow">РАЗДЕЛ 02 · A1</div><h2 lang="es-ES">Los meses y los días de la semana</h2><p class="numbers-intro">Месяцы и дни недели. В испанском их названия пишутся со строчной буквы.</p><div class="number-groups">${table('Los meses · Месяцы', months).replace('<table>', `<button class="story-play" type="button" data-story="${monthsAudioIndex}" data-play-label="Слушать месяцы" aria-label="Слушать месяцы">▶ Слушать месяцы</button><table>`)}${table('Los días de la semana · Дни недели', weekdays).replace('<table>', `<button class="story-play" type="button" data-story="${weekdaysAudioIndex}" data-play-label="Слушать дни недели" aria-label="Слушать дни недели">▶ Слушать дни недели</button><table>`)}</div></article>`);
  document.getElementById('story-nav').insertAdjacentHTML('beforeend', '<a href="#calendar"><span class="eyebrow">02 · A1</span><br><span lang="es-ES">Los meses y los días</span></a>');
}

const response = await fetch('./content.json', {cache: 'no-cache'});
if (!response.ok) throw new Error(`Content request failed: ${response.status}`);
const content = await response.json();
render(content.stories);
renderNumbers();
renderCalendar();
// Keep audio indices stable while placing the learning sections first.
main.prepend(document.getElementById('numbers'), document.getElementById('calendar'));
const navigation = document.getElementById('story-nav');
const heading = navigation.querySelector('strong');
heading.after(navigation.querySelector('a[href="#numbers"]'), navigation.querySelector('a[href="#calendar"]'));

const sectionLinks = [...navigation.querySelectorAll('a[href^="#"]')];
const readingSections = [...main.querySelectorAll('article[id]')];
let currentSectionId = '';
let navigationScrollTarget = null;
let navigationScrollTimer;
function setCurrentSection(id) {
  if (id === currentSectionId) return;
  currentSectionId = id;
  sectionLinks.forEach(link => {
    if (link.hash === '#' + id) {
      link.setAttribute('aria-current', 'location');
      // Keep the active link visible within the sidebar without moving the page.
      const box = link.getBoundingClientRect();
      const panel = navigation.getBoundingClientRect();
      if (navigation.scrollHeight > navigation.clientHeight) {
        if (box.top < panel.top) navigation.scrollTop -= panel.top - box.top + 8;
        else if (box.bottom > panel.bottom) navigation.scrollTop += box.bottom - panel.bottom + 8;

<script>
(() => {
 const audio = document.getElementById('fixed-audio');
 const dock = document.querySelector('.player-dock');
 // Keep the fixed player inside Safari's visible viewport, including its toolbars.
 const positionPlayer = () => {
  const viewport = window.visualViewport;
  const bottom = viewport && viewport.scale === 1
   ? Math.max(0, window.innerHeight - viewport.height - viewport.offsetTop) : 0;
  dock.style.setProperty('--player-viewport-bottom', bottom + 'px');
 };
 const refreshPlayerPosition = () => { positionPlayer(); requestAnimationFrame(positionPlayer); };
 window.addEventListener('resize', refreshPlayerPosition);
 window.addEventListener('pageshow', refreshPlayerPosition);
 if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', refreshPlayerPosition);
  window.visualViewport.addEventListener('scroll', refreshPlayerPosition);
 }
 audio.addEventListener('play', refreshPlayerPosition);
 positionPlayer();
 const controls = document.createElement('div');
 controls.className = 'mobile-player';
 controls.innerHTML = `<div class="mobile-transport"><button type="button" class="mobile-back" aria-label="Назад на 3 секунды"><svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8a11 11 0 1 1-2 12"/><path d="M7 3v5h5"/></g><text x="16" y="20.5" text-anchor="middle" fill="currentColor" font-family="system-ui,sans-serif" font-size="13" font-weight="650">3</text></svg></button><button type="button" class="mobile-play" aria-label="Воспроизвести">▶</button><button type="button" class="mobile-forward" aria-label="Вперёд на 3 секунды"><svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true" focusable="false"><g transform="translate(32 0) scale(-1 1)" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8a11 11 0 1 1-2 12"/><path d="M7 3v5h5"/></g><text x="16" y="20.5" text-anchor="middle" fill="currentColor" font-family="system-ui,sans-serif" font-size="13" font-weight="650">3</text></svg></button></div><div class="mobile-seek-row"><span class="mobile-elapsed">0:00</span><input type="range" min="0" max="100" step="0.1" value="0" aria-label="Позиция воспроизведения" disabled><span class="mobile-duration">0:00</span></div>`;
 dock.append(controls);

 const duration = controls.querySelector('.mobile-duration');

  const ready = Number.isFinite(audio.duration) && audio.duration > 0;
  seek.disabled = !ready;
  seek.max = ready ? audio.duration : 100;
  seek.value = audio.currentTime || 0;

  duration.textContent = format(audio.duration);

 };

})();
