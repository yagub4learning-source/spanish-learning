sa a las nueve. Vive en una ciudad pequeña, cerca del mar. Le gusta caminar por las calles y mirar las tiendas.\n\nHoy hace buen tiempo. El cielo está azul y no hace frío. Pablo decide ir al centro de la ciudad.\n\nPrimero, pasa por una panadería. Huele a pan recién hecho. Pablo entra y compra una barra de pan y un café con leche.\n\nDespués, va a un parque. Hay muchos árboles y algunas personas están sentadas en los bancos. Pablo encuentra un banco libre, se sienta y bebe su café.\n\nMientras está sentado, ve un perro pequeño que juega con una pelota. El perro corre detrás de la pelota, pero de repente la pelota llega hasta los pies de Pablo.\n\nPablo recoge la pelota y se la da al perro. El perro mueve la cola y vuelve a jugar.\n\nPablo sonríe. Es una mañana tranquila, pero muy agradable.", "ru": "Каждое утро Пабло выходит из дома в девять. Он живёт в небольшом городе недалеко от моря. Ему нравится гулять по улицам и рассматривать магазины.\n\nСегодня хорошая погода. Небо голубое, и на улице не холодно. Пабло решает пойти в центр города.\n\nСначала он проходит мимо пекарни. Пахнет свежеиспечённым хлебом. Пабло заходит и покупает багет и кофе с молоком.\n\nПотом он идёт в парк. Там много деревьев, а на скамейках сидят люди. Пабло находит свободную скамейку, садится и пьёт кофе.\n\nСидя на скамейке, он видит маленькую собаку, которая играет с мячом. Собака бежит за мячом, но вдруг мяч подкатывается к ногам Пабло.\n\nПабло поднимает мяч и отдаёт его собаке. Собака виляет хвостом и снова начинает играть.\n\nПабло улыбается. Это спокойное, но очень приятное утро."}, "sentences": [{"es": "Cada mañana, Pablo sale de casa a las nueve.", "ru": "Каждое утро Пабло выходит из дома в девять."}, {"es": "Vive en una ciudad pequeña, cerca del mar.", "ru": "Он живёт в небольшом городе недалеко от моря."}, {"es": "Le gusta caminar por las calles y mirar las tiendas.", "ru": "Ему нравится гулять по улицам и рассматривать магазины."}, {"es": "Hoy hace buen tiempo.", "ru": "Сегодня хо a con tomate, por favor. —¿Y para ti? —Otro café con leche, gracias —dice Luis.", "Ana come la tostada. El café está caliente. Luis habla de su trabajo y Ana escucha.", "—¿Qué hora es? —pregunta Ana. —Son las nueve y media. —Vale. Tengo que ir a trabajar.", "—La cuenta, por favor. ¿Cuánto es? —Seis euros. Ana paga y sale con Luis. La tienda está cerca. No tiene prisa."], "ru": ["Понедельник. Ана живёт в Мадриде и работает в магазине. Сегодня она начинает в десять. У неё есть время позавтракать.", "Рядом с её домом есть небольшой бар. Ана заходит. Её друг Луис сидит за столиком.", "— Привет, Ана! Как дела? — Очень хорошо, а у тебя? — Хорошо. Хочешь кофе?", "Ана садится. Подходит официант. — Доброе утро. Кофе с молоком и тост с помидором, пожалуйста. — А тебе? — Ещё один кофе с молоком, спасибо, — говорит Луис.", "Ана ест тост. Кофе горячий. Луис рассказывает о работе, а Ана слушает.", "— Который час? — спрашивает Ана. — Половина десятого. — Хорошо. Мне нужно идти на работу.", "— Счёт, пожалуйста. Сколько с нас? — Шесть евро. Ана платит и выходит с Луисом. Магазин рядом. Она не спешит."], "vocab": [["¿Qué tal?", "Как дела?"], ["¿Quieres…?", "Хочешь…?"], ["para mí / para ti", "для меня / для тебя"], ["Son las nueve y media.", "Сейчас половина десятого."], ["tener que + infinitivo", "нужно что-то сделать"], ["La cuenta, por favor.", "Счёт, пожалуйста."], ["¿Cuánto es?", "Сколько с меня / с нас?"], ["vale", "хорошо, ладно"]], "full_text": {"es": "Es lunes. Ana vive en Madrid y trabaja en una tienda. Hoy entra a las diez. Tiene tiempo para desayunar.\n\nCerca de su casa hay un bar pequeño. Ana entra. Su amigo Luis está en una mesa.\n\n—¡Hola, Ana! ¿Qué tal? —Muy bien, ¿y tú? —Bien. ¿Quieres un café?\n\nAna se sienta. El camarero se acerca. —Buenos días. Un café con leche y una tostada con tomate, por favor. —¿Y para ti? —Otro café con leche, gracias —dice Luis.\n\nAna come la tostada. El café está caliente. Luis habla de su trabajo y Ana escucha.\n\n—¿Qué hora es? —pregunta Ana. —Son las nueve y media. —Vale. Tengo que ir a trabajar.\n\n—La cuenta, por favor. ¿Cuánto es? —Seis euros. Ana paga y sale con Luis. La tienda está cerca. No tiene prisa.", "ru": "Понедельник. Ана живёт в Мадриде и работает в магазине. Сегодня она начинает в десять. У неё есть время позавтракать.\n\nРядом с её домом есть небольшой бар. Ана заходит. Её друг Луис сидит за столиком.\n\n— Привет, Ана! Как дела? — Очень хорошо, а у тебя? — Хорошо. Хочешь кофе?\n\nАна садится. Подходит официант. — Доброе утро. Кофе с молоком и тост с помидором, пожалуйста. — А тебе? — Ещё один кофе с молоком, спасибо, — говорит Луис.\n\nАна ест тост. Кофе горячий. Луис рассказывает о работе, а Ана слушает.\n\n— Который час? — спрашивает Ана. — Половина десятого. — Хорошо. Мне нужно идти на работу.\n\n— Счёт, пожалуйста. Сколько с нас? — Шесть евро. Ана платит и выходит с Луисом. Магазин рядом. Она не спешит."}, "sentences": [{"es": "Es lunes.", "ru": "Понедельник."}, {"es": "Ana vive en Madrid y trabaja en una tienda.", "ru": "Ана живёт в Мадриде и работает в магазине."}, {"es": "Hoy entra a las diez.", "ru": "Сегодня она начинает в десять."}, {"es": "Tiene tiempo para desayunar.", "ru": "У неё есть время позавтракать."}, {"es": "Cerca de su casa hay un bar pequeño.", "ru": "Рядом с её домом есть небольшой бар."}, {"es": "Ana entra.", "ru": "Ана заходит."}, {"es": "Su amigo Luis está en una mesa.", "ru": "Её друг Луис сидит за столиком."}, {"es": "—¡Hola, Ana!", "ru": "— Привет, Ана!"}, {"es": "¿Qué tal?", "ru": "Как дела?"}, {"es": "—Muy bien, ¿y tú?", "ru": "— Очень хорошо, а у тебя?"}, {"es": "—Bien.", "ru": "— Хорошо."}, {"es": "¿Quieres un café?", "ru": "Хочешь кофе?"}, {"es": "Ana se sienta.", "ru": "Ана садится."}, {"es": "El camarero se acerca.", "ru": "Подходит официант."}, {"es": "—Buenos días.", "ru": "— Доброе утро."}, {"es": "Un café con leche y una tostada con tomate, por favor.", "ru": "Кофе с молоком и тост с помидором, пожалуйста."}, {"es": "—¿Y para ti?", "ru": " и, — говорит Марта. — Хорошо. Нам ещё нужны помидоры, — говорит её брат.", "Марта берёт сумку и выходит из дома. Супермаркет находится рядом с аптекой, в пяти минутах от её дома.", "В супермаркете много людей. Марта ищет помидоры. Она их не видит. — Извини, где помидоры? — Там, справа. — Большое спасибо.", "Помидоры стоят два евро за килограмм. Марта покупает килограмм. Она также покупает четыре яблока и багет.", "На кассе женщина спрашивает: — Тебе нужен пакет? — Нет, спасибо. У меня есть. Можно заплатить картой? — Да, конечно.", "Марта возвращается домой. Её брат готовит салат. Марта кладёт хлеб на стол. — Поедим? — Да! Я очень голоден."], "vocab": [["hay / no hay", "есть / нет"], ["hacer la compra", "покупать продукты"], ["coger una bolsa", "взять сумку"], ["al lado de", "рядом с"], ["a la derecha", "справа"], ["¿Puedo pagar con tarjeta?", "Можно заплатить картой?"], ["Sí, claro.", "Да, конечно."], ["tener hambre", "хотеть есть"]], "full_text": {"es": "Marta abre la nevera. Hay leche y dos huevos, pero no hay pan. Tampoco hay fruta.\n\n—Voy a hacer la compra —dice Marta. —Vale. Necesitamos tomates también —dice su hermano.\n\nMarta coge una bolsa y sale de casa. El supermercado está al lado de la farmacia, a cinco minutos de su casa.\n\nEn el supermercado hay mucha gente. Marta busca los tomates. No los ve. —Perdona, ¿dónde están los tomates? —Allí, a la derecha. —Muchas gracias.\n\nLos tomates cuestan dos euros el kilo. Marta compra un kilo. También compra cuatro manzanas y una barra de pan.\n\nEn la caja, una mujer pregunta: —¿Quieres una bolsa? —No, gracias. Tengo una. ¿Puedo pagar con tarjeta? —Sí, claro.\n\nMarta vuelve a casa. Su hermano prepara una ensalada. Marta pone el pan en la mesa. —¿Comemos? —¡Sí! Tengo mucha hambre.", "ru": "Марта открывает холодильник. Есть молоко и два яйца, но нет хлеба. Фруктов тоже нет.\n\n— Я пойду за покупками, — говорит Марта. — Хорошо. Нам ещё нужны помидоры, — говорит её брат.\n\nМарта берёт сумку и выходит из дома. Супермаркет находится рядом с аптекой, в пяти минутах от её дома.\n\nВ супермаркете много людей. Марта ищет помидоры. Она их не видит. — Извини, где помидоры? — Там, справа. — Большое спасибо.\n\nПомидоры стоят два евро за килограмм. Марта покупает килограмм. Она также покупает четыре яблока и багет.\n\nНа кассе женщина спрашивает: — Тебе нужен пакет? — Нет, спасибо. У меня есть. Можно заплатить картой? — Да, конечно.\n\nМарта возвращается домой. Её брат готовит салат. Марта кладёт хлеб на стол. — Поедим? — Да! Я очень голоден."}, "sentences": [{"es": "Marta abre la nevera.", "ru": "Марта открывает холодильник."}, {"es": "Hay leche y dos huevos, pero no hay pan.", "ru": "Есть молоко и два яйца, но нет хлеба."}, {"es": "Tampoco hay fruta.", "ru": "Фруктов тоже нет."}, {"es": "—Voy a hacer la compra —dice Marta.", "ru": "— Я пойду за покупками, — говорит Марта."}, {"es": "—Vale.", "ru": "— Хорошо."}, {"es": "Necesitamos tomates también —dice su hermano.", "ru": "Нам ещё нужны помидоры, — говорит её брат."}, {"es": "Marta coge una bolsa y sale de casa.", "ru": "Марта берёт сумку и выходит из дома."}, {"es": "El supermercado está al lado de la farmacia, a cinco minutos de su casa.", "ru": "Супермаркет находится рядом с аптекой, в пяти минутах от её дома."}, {"es": "En el supermercado hay mucha gente.", "ru": "В супермаркете много людей."}, {"es": "Marta busca los tomates.", "ru": "Марта ищет помидоры."}, {"es": "No los ve.", "ru": "Она их не видит."}, {"es": "—Perdona, ¿dónde están los tomates?", "ru": "— Извини, где помидоры?"}, {"es": "—Allí, a la derecha.", "ru": "— Там, справа."}, {"es": "—Muchas gracias.", "ru": "— Большое спасибо."}, {"es": "Los tomates cuestan dos euros el kilo.", "ru": "Помидоры стоят два евро за килограмм."}, {"es": "Marta compra un kilo.", "ru": "Марта покупает килограмм."}, {"es": "También compra cuatro manzanas y una barra de pan.", "ru": "Она также покупает четыре яблока и багет."}, {"es": "En la caja, una mujer pregunta:", "ru": "На кассе женщина спрашивает:"}, {"es": "—¿Quieres una bolsa?", "ru": "— Тебе нужен пакет?"}, {"es": "—No, gracias.", "ru": "— Нет, спасибо."}, {"es": "Tengo una.", "ru": "У меня есть."}, {"es": "¿Puedo pagar con tarjeta?", "ru": "Можно заплатить картой?"}, {"es": "—Sí, claro.", "ru": "— Да, конечно."}, {"es": "Marta vuelve a casa.", "ru": "Марта возвращается домой."}, {"es": "Su hermano prepara una ensalada.", "ru": "Её брат готовит салат."}, {"es": "Marta pone el pan en la mesa.", "ru": "Марта кладёт хлеб на стол."}, {"es": "—¿Comemos?", "ru": "— Поедим?"}, {"es": "—¡Sí!", "ru": "— Да!"}, {"es": "Tengo mucha hambre.", "ru": "Я очень голоден."}], "audio": {"src": "story_3.mp3", "available": true}}, {"id": "story-4", "title": "Una tarde en el parque", "level": "A1", "es": ["Es sábado. A David le gusta estar en casa, pero hoy hace sol. Quiere salir. Su amiga Sara llama por teléfono.", "—Hola, David. ¿Qué haces? —Nada. Estoy en casa. —¿Vamos al parque? —Vale. ¿A qué hora? —A las cinco, en la entrada.", "David se pone una camiseta y coge las llaves. El parque no está lejos. Va a pie.", "Sara está en la entrada con su perro. —Este es Toby —dice Sara. —¡Hola, Toby! Es muy bonito.", "Los dos amigos pasean y hablan. Toby camina con ellos. En el parque hay niños, familias y muchas bicicletas.", "—Tengo un poco de sed —dice David. —Hay una fuente aquí. David bebe agua. Sara da agua a Toby también.", "Después se sientan en un banco. Toby se sienta a su lado. —Me gusta este parque —dice David. —A mí también. ¿Volvemos mañana? —¡Vale!"], "ru": ["Суббота. Давиду нравится быть дома, но сегодня солнечно. Он хочет выйти. Его подруга Сара звонит по телефону.", "— Привет, Давид. Что делаешь? — Ничего. Я дома. — Пойдём в парк? — Хорошо. Во сколько? — В пять, у входа.", "Давид надевает футболку и берёт ключи. Парк недалеко. Он идёт пешком.", "Сара стоит у входа со своей собакой. — Это Тоби, — говорит Сара. — Привет, Тоби! Он очень красивый.", "Друзья гуляют и разговаривают. Тоби идёт с ними. В парке есть дети, семьи и много велосипедов.", "— Я немного хочу пить, — говорит Давид. — Здесь есть питьевой фонтанчик. Давид пьёт воду. Сара тоже даёт Тоби воды.", "Потом они садятся на скамейку. Тоби садится рядом. — Мне нравится этот парк, — говорит Давид. — Мне тоже. Вернёмся завтра? — Хорошо!"], "vocab": [["¿Qué haces?", "Что делаешь?"], ["¿Vamos al parque?", "Пойдём в парк?"], ["¿A qué hora?", "Во сколько?"], ["ir a pie", "идти пешком"], ["no está lejos", "находится недалеко"], ["tener sed", "хотеть пить"], ["Me gusta…", "Мне нравится…"], ["A mí también.", "Мне тоже."]], "full_text": {"es": "Es sábado. A David le gusta estar en casa, pero hoy hace sol. Quiere salir. Su amiga Sara llama por teléfono.\n\n—Hola, David. ¿Qué haces? —Nada. Estoy en casa. —¿Vamos al parque? —Vale. ¿A qué hora? —A las cinco, en la entrada.\n\nDavid se pone una camiseta y coge las llaves. El parque no está lejos. Va a pie.\n\nSara está en la entrada con su perro. —Este es Toby —dice Sara. —¡Hola, Toby! Es muy bonito.\n\nLos dos amigos pasean y hablan. Toby camina con ellos. En el parque hay niños, familias y muchas bicicletas.\n\n—Tengo un poco de sed —dice David. —Hay una fuente aquí. David bebe agua. Sara da agua a Toby también.\n\nDespués se sientan en un banco. Toby se sienta a su lado. —Me gusta este parque —dice David. —A mí también. ¿Volvemos mañana? —¡Vale!", "ru": "Суббота. Давиду нравится быть дома, но сегодня солнечно. Он хочет выйти. Его подруга Сара звонит по телефону.\n\n— Привет, Давид. Что делаешь? — Ничего. Я дома. — Пойдём в парк? — Хорошо. Во сколько? — В пять, у входа.\n\nДавид надевает футболку и берёт ключи. Парк недалеко. Он идёт пешком.\n\nСара стоит у входа со своей собакой. — Это Тоби, — говорит Сара. — Привет, Тоби! Он очень красивый.\n\nДрузья гуляют и разговаривают. Тоби идёт с ними. В парке есть дети, семьи и много велосипедов.\n\n— Я немного хочу пить, — говорит Давид. — Здесь есть питьевой фонтанчик. Давид пьёт воду. Сара тоже даёт Тоби воды.\n\nПотом они садятся на скамейку. Тоби садится рядом. — Мне нравится этот парк, — говорит Давид. — Мне тоже. Вернёмся завтра? — Хорошо!"}, "sentences": [{"es": "Es sábado.", "ru": "Суббота."}, {"es": "A David le gusta estar en casa, pero hoy hace sol.", "ru": "Давиду нравится быть дома, но сегодня солнечно."}, {"es": "Quiere salir.", "ru": "Он хочет выйти."}, {"es": "Su amiga Sara llama por teléfono.", "ru": "Его подруга Сара звонит по телефону."}, {"es": "—Hola, David.", "ru": "— Привет, Давид."}, {"es": "¿Qué haces?", "ru": "Что делаешь?"}, {"es": "—Nada.", "ru": "— Ничего."}, {"es": "Estoy en casa.", "ru": "Я дома."}, {"es": "—¿Vamos al parque?", "ru": "— Пойдём в парк?"}, {"es": "—Vale.", "ru": "— Хорошо."}, {"es": "¿A qué hora?", "ru": "Во сколько?"}, {"es": "—A las cinco, en la entrada.", "ru": "— В пять, у входа."}, {"es": "David se pone una camiseta y coge las llaves.", "ru": "Давид надевает футболку и берёт ключи."}, {"es": "El parque no está lejos.", "ru": "Парк недалеко."}, {"es": "Va a pie.", "ru": "Он идёт пешком."}, {"es": "Sara está en la entrada con su perro.", "ru": "Сара стоит у входа со своей собакой."}, {"es": "—Este es Toby —dice Sara.", "ru": "— Это Тоби, — говорит Сара."}, {"es": "—¡Hola, Toby!", "ru": "— Привет, Тоби!"}, {"es": "Es muy bonito.", "ru": "Он очень красивый."}, {"es": "Los dos amigos pasean y hablan.", "ru": "Друзья гуляют и разговаривают."}, {"es": "Toby camina con ellos.", "ru": "Тоби идёт с ними."}, {"es": "En el parque hay niños, familias y muchas bicicletas.", "ru": "В парке есть дети, семьи и много велосипедов."}, {"es": "—Tengo un poco de sed —dice David.", "ru": "— Я немного хочу пить, — говорит Давид."}, {"es": "—Hay una fuente aquí.", "ru": "— Здесь есть питьевой фонтанчик."}, {"es": "David bebe agua.", "ru": "Давид пьёт воду."}, {"es": "Sara da agua a Toby también.", "ru": "Сара тоже даёт Тоби воды."}, {"es": "Después se sientan en un banco.", "ru": "Потом они садятся на скамейку."}, {"es": "Toby se sienta a su lado.", "ru": "Тоби сад магазины, дома и людей. Через десять минут она видит рынок. Это её остановка. Элена выходит из автобуса.\n\nМаркос на площади. — Привет, Элена! Как доехала? — Хорошо. Где поедим? — Здесь есть ресторан. Комплексный обед очень хороший.\n\nОни заходят в ресторан и ищут столик. — Я хочу суп и рыбу, — говорит Элена. — А я — салат и курицу, — говорит Маркос. Оба голодны. Пора обедать!"}, "sentences": [{"es": "Elena vive en un barrio de Valencia.", "ru": "Элена живёт в одном из районов Валенсии."}, {"es": "Hoy quiere ir al centro.", "ru": "Сегодня она хочет поехать в центр."}, {"es": "Su amigo Marcos trabaja allí.", "ru": "Её друг Маркос работает там."}, {"es": "Van a comer juntos.", "ru": "Они собираются вместе пообедать."}, {"es": "Elena sale de casa a la una.", "ru": "Элена выходит из дома в час."}, {"es": "En la parada hay una señora.", "ru": "На остановке стоит женщина."}, {"es": "—Buenos días.", "ru": "— Добрый день."}, {"es": "¿El autobús número diez va al centro?", "ru": "Автобус номер десять идёт в центр?"}, {"es": "—Sí, pero hoy tarda un poco.", "ru": "— Да, но сегодня его приходится немного ждать."}, {"es": "Elena mira el móvil.", "ru": "Элена смотрит в телефон."}, {"es": "Tiene un mensaje de Marcos: «Estoy en la plaza, al lado del mercado».", "ru": "У неё сообщение от Маркоса: «Я на площади, рядом с рынком»."}, {"es": "Llega el autobús.", "ru": "Приходит автобус."}, {"es": "Elena sube.", "ru": "Элена заходит."}, {"es": "—Un billete, por favor.", "ru": "— Один билет, пожалуйста."}, {"es": "El conductor le da el billete.", "ru": "Водитель даёт ей билет."}, {"es": "Elena paga y se sienta junto a la ventana.", "ru": "Элена платит и садится у окна."}, {"es": "Por la ventana ve tiendas, casas y gente.", "ru": "Из окна она видит магазины, дома и людей."}, {"es": "Después de diez minutos, ve el mercado.", "ru": "Через десять минут она видит рынок."}, {"es": "Es su parada.", "ru": "Это её остановка."}, {"es": "Elena baja del autobús.", "ru": "Элена выходит из автобуса."}, {"es": "Marcos está en la plaza.", "ru": "Маркос на площади."}, {"es": "—¡Hola, Elena!", "ru": "— Привет, Элена!"}, {"es": "¿Qué tal el viaje?", "ru": "Как доехала?"}, {"es": "—Bien.", "ru": "— Хорошо."}, {"es": "¿Dónde comemos?", "ru": "Где поедим?"}, {"es": "—Hay un restaurante aquí.", "ru": "— Здесь есть ресторан."}, {"es": "El menú del día está muy bien.", "ru": "Комплексный обед очень хороший."}, {"es": "Entran en el restaurante y buscan una mesa.", "ru": "Они заходят в ресторан и ищут столик."}, {"es": "—Yo quiero sopa y pescado —dice Elena.", "ru": "— Я хочу суп и рыбу, — говорит Элена."}, {"es": "—Yo, ensalada y pollo —dice Marcos.", "ru": "— А я — салат и курицу, — говорит Маркос."}, {"es": "Los dos tienen hambre.", "ru": "Оба голодны."}, {"es": "¡Es hora de comer!", "ru": "Пора обедать!"}], "audio": {"src": "story_5.mp3", "available": true}}, {"id": "story-6", "title": "Las llaves de Diego", "level": "A1", "es": ["Diego vive en un piso pequeño en Madrid. Cada mañana desayuna en la cocina. Después coge el móvil, las llaves y la mochila. Sale de casa a las ocho para ir a trabajar.", "Hoy tiene un poco de sueño. Prepara un café con leche y una tostada. Come despacio y mira la hora en el móvil. Ya son las ocho. Tiene que salir.", "Diego coge la mochila, pero no encuentra las llaves. Normalmente están en una mesa junto a la puerta. Hoy la mesa está vacía.", "Primero busca en los bolsillos de la chaqueta. No están allí. Después mira en la mochila. Hay un libro, una botella de agua y un bocadillo, pero no hay llaves.", "Diego vuelve a la cocina. Mira debajo de la mesa y al lado de la nevera. Tampoco están allí. Ahora tiene prisa y está un poco nervioso.", "Necesita pensar un momento. Se sienta y coge la taza para beber un poco más de café. Entonces ve las llaves. Están detrás de la taza, junto al plato.", "Diego sonríe y guarda las llaves en el bolsillo. Sale de casa y va a la parada de autobús. El autobús llega en ese momento. Hoy tiene suerte."], "ru": ["Диего живёт в небольшой квартире в Мадриде. Каждое утро он завтракает на кухне. Затем берёт телефон, ключи и рюкзак. Он выходит из дома в восемь, чтобы идти на работу.", "Сегодня ему немного хочется спать. Он готовит кофе с молоком и тост. Он ест не спеша и смотрит время в телефоне. Уже восемь. Ему нужно выходить.", "Диего берёт рюкзак, но не находит ключи. Обычно они лежат на столике у двери. Сегодня столик пуст.", "Сначала он ищет в карманах куртки. Их там нет. Затем заглядывает в рюкзак. Там есть книга, бутылка воды и бутерброд, но ключей нет.", "Диего возвращается на кухню. Он смотрит под столом и рядом с холодильником. Там их тоже нет. Теперь он спешит и немного нервничает.", "Ему нужно немного подумать. Он садится и берёт чашку, чтобы выпить ещё немного кофе. Тут он видит ключи. Они за чашкой, рядом с тарелкой.", "Диего улыбается и кладёт ключи в карман. Он выходит из дома и идёт на автобусную остановку. Автобус приходит как раз в этот момент. Сегодня ему везёт."], "vocab": [["el piso", "квартира"], ["tener sueño", "хотеть спать"], ["tener que salir", "нужно выходить"], ["buscar", "искать"], ["debajo de", "под"], ["detrás de", "за, позади"], ["tener prisa", "спешить"], ["tener suerte", "везти"]], "full_text": {"es": "Diego vive en un piso pequeño en Madrid. Cada mañana desayuna en la cocina. Después coge el móvil, las llaves y la mochila. Sale de casa a las ocho para ir a trabajar.\n\nHoy tiene un poco de sueño. Prepara un café con leche y una tostada. Come despacio y mira la hora en el móvil. Ya son las ocho. Tiene que salir.\n\nDiego coge la mochila, pero no encuentra las llaves. Normalmente están en una mesa junto a la puerta. Hoy la mesa está vacía.\n\nPrimero busca en los bolsillos de la chaqueta. No están allí. Después mira en la mochila. Hay un libro, una botella de agua y un bocadillo, pero no hay llaves.\n\nDiego vuelve a la cocina. Mira debajo de la mesa y al lado de la nevera. Tampoco están allí. Ahora tiene prisa y está un poco nervioso.\n\nNecesita pensar un momento. Se sienta y coge la taza para beber un poco más de café. Entonces ve las llaves. Están detrás de la taza, junto al plato.\n\nDiego sonríe y guarda las llaves en el bolsillo. Sale de casa y va a la parada de autobús. El autobús llega en ese momento. Hoy tiene suerte.", "ru": "Диего живёт в небольшой квартире в Мадриде. Каждое утро он завтракает на кухне. Затем берёт телефон, ключи и рюкзак. Он выходит из дома в восемь, чтобы идти на работу.\n\nСегодня ему немного хочется спать. Он готовит кофе с молоком и тост. Он ест не спеша и смотрит время в телефоне. Уже восемь. Ему нужно выходить.\n\nДиего берёт рюкзак, но не находит ключи. Обычно они лежат на столике у двери. Сегодня столик пуст.\n\nСначала он ищет в карманах куртки. Их там нет. Затем заглядывает в рюкзак. Там есть книга, бутылка воды и бутерброд, но ключей нет.\n\nДиего возвращается на кухню. Он смотрит под столом и рядом с холодильником. Там их тоже нет. Теперь он спешит и немного нервничает.\n\nЕму нужно немного подумать. Он садится и берёт чашку, чтобы выпить ещё немного кофе. Тут он видит ключи. Они за чашкой, рядом с тарелкой.\n\nДиего улыбается и кладёт ключи в карман. Он выходит из дома и идёт на автобусную остановку. Автобус приходит как раз в этот момент. Сегодня ему везёт."}, "sentences": [{"es": "Diego vive en un piso pequeño en Madrid.", "ru": "Диего живёт в небольшой квартире в Мадриде."}, {"es": "Cada mañana desayuna en la cocina.", "ru": "Каждое утро он завтракает на кухне."}, {"es": "Después coge el móvil, las llaves y la mochila.", "ru": "Затем берёт телефон, ключи и рюкзак."}, {"es": "Sale de casa a las ocho para ir a trabajar.", "ru": "Он выходит из дома в восемь, чтобы идти на работу."}, {"es": "Hoy tiene un poco de sueño.", "ru": "Сегодня ему немного хочется спать."}, {"es": "Prepara un café con leche y una tostada.", "ru": "Он готовит кофе с молоком и тост."}, {"es": "Come despacio y mira la hora en el móvil.", "ru": "Он ест не спеша и смотрит время в телефоне."}, {"es": mercado de su barrio. Le gusta comprar fruta y verdura. El mercado está cerca de su casa y siempre va a pie.", "Hoy hace buen tiempo. Clara sale con una bolsa grande. En la calle hay mucha gente. Algunas personas pasean y otras desayunan en una terraza.", "En el mercado, Clara compra tomates, patatas y seis naranjas. Las naranjas son grandes y tienen un color muy bonito. Clara quiere hacer zumo en casa.", "Pone todo en la bolsa y sale del mercado. Ahora la bolsa pesa mucho. Clara camina despacio y para un momento en una plaza.", "Deja la bolsa en un banco. Algunas naranjas salen de la bolsa y caen al suelo. Clara ve dos naranjas debajo del banco.", "Clara recoge las naranjas. Una niña está cerca con su padre. La niña ve otra naranja junto a un árbol y la recoge también. Ahora Clara tiene otra vez sus seis naranjas.", "Clara sonríe a la niña y a su padre. Después vuelve a casa con la bolsa en las dos manos. Lava las naranjas y prepara un vaso de zumo. El zumo está muy bueno."], "ru": ["По воскресеньям Клара ходит на рынок своего района. Ей нравится покупать фрукты и овощи. Рынок рядом с её домом, и она всегда ходит пешком.", "Сегодня хорошая погода. Клара выходит с большой сумкой. На улице много людей. Одни гуляют, а другие завтракают на открытой террасе кафе.", "На рынке Клара покупает помидоры, картошку и шесть апельсинов. Апельсины большие и очень красивого цвета. Клара хочет приготовить дома сок.", "Она кладёт всё в сумку и выходит с рынка. Теперь сумка очень тяжёлая. Клара идёт медленно и ненадолго останавливается на площади.", "Она ставит сумку на скамейку. Несколько апельсинов выкатываются из сумки и падают на землю. Клара видит два апельсина под скамейкой.", "Клара поднимает апельсины. Рядом стоит девочка с папой. Девочка видит ещё один апельсин возле дерева и тоже поднимает его. Теперь у Клары снова все шесть апельсинов.", "Клара улыбается девочке и её папе. Затем возвращается домой, держа сумку двумя руками. Она моет апельсины и готовит стакан сока. Сок очень вкусный."], "vocab": [["el barrio", "район"], ["ir a pie", "идти пешком"], ["la terraza", "открытая площадка кафе"], ["el zumo de naranja", "апельсиновый сок"], ["pesar mucho", "быть тяжёлым"], ["el suelo", "земля, пол"], ["recoger", "поднимать, собирать"], ["Está muy bueno.", "Очень вкусно."]], "full_text": {"es": "Los domingos, Clara va al mercado de su barrio. Le gusta comprar fruta y verdura. El mercado está cerca de su casa y siempre va a pie.\n\nHoy hace buen tiempo. Clara sale con una bolsa grande. En la calle hay mucha gente. Algunas personas pasean y otras desayunan en una terraza.\n\nEn el mercado, Clara compra tomates, patatas y seis naranjas. Las naranjas son grandes y tienen un color muy bonito. Clara quiere hacer zumo en casa.\n\nPone todo en la bolsa y sale del mercado. Ahora la bolsa pesa mucho. Clara camina despacio y para un momento en una plaza.\n\nDeja la bolsa en un banco. Algunas naranjas salen de la bolsa y caen al suelo. Clara ve dos naranjas debajo del banco.\n\nClara recoge las naranjas. Una niña está cerca con su padre. La niña ve otra naranja junto a un árbol y la recoge también. Ahora Clara tiene otra vez sus seis naranjas.\n\nClara sonríe a la niña y a su padre. Después vuelve a casa con la bolsa en las dos manos. Lava las naranjas y prepara un vaso de zumo. El zumo está muy bueno.", "ru": "По воскресеньям Клара ходит на рынок своего района. Ей нравится покупать фрукты и овощи. Рынок рядом с её домом, и она всегда ходит пешком.\n\nСегодня хорошая погода. Клара выходит с большой сумкой. На улице много людей. Одни гуляют, а другие завтракают на открытой террасе кафе.\n\nНа рынке Клара покупает помидоры, картошку и шесть апельсинов. Апельсины большие и очень красивого цвета. Клара хочет приготовить дома сок.\n\nОна кладёт всё в сумку и выходит с рынка. Теперь сумка очень тяжёлая. Клара идёт медленно и ненадолго останавливается на площади.\n\nОна ставит сумку на скамейку. Несколько апельсинов выкатываются из сумки и падают на землю. Клара видит два апельсина под скамейкой.\n\nКлара поднимает апельсины. Рядом стоит девочка с папой. Девочка видит ещё один апельсин возле дерева и тоже поднимает его. Теперь у Клары снова все шесть апельсинов.\n\nКлара улыбается девочке и её папе. Затем возвращается домой, держа сумку двумя руками. Она моет апельсины и готовит стакан сока. Сок очень вкусный."}, "sentences": [{"es": "Los domingos, Clara va al mercado de su barrio.", "ru": "По воскресеньям Клара ходит на рынок своего района."}, {"es": "Le gusta comprar fruta y verdura.", "ru": "Ей нравится покупать фрукты и овощи."}, {"es": "El mercado está cerca de su casa y siempre va a pie.", "ru": "Рынок рядом с её домом, и она всегда ходит пешком."}, {"es": "Hoy hace buen tiempo.", "ru": "Сегодня хорошая погода."}, {"es": "Clara sale con una bolsa grande.", "ru": "Клара выходит с большой сумкой."}, {"es": "En la calle hay mucha gente.", "ru": "На улице много людей."}, {"es": "Algunas personas pasean y otras desayunan en una terraza.", "ru": "Одни гуляют, а другие завтракают на открытой террасе кафе."}, {"es": "En el mercado, Clara compra tomates, patatas y seis naranjas.", "ru": "На рынке Клара покупает помидоры, картошку и шесть апельсинов."}, {"es": "Las naranjas son grandes y tienen un color muy bonito.", "ru": "Апельсины большие и очень красивого цвета."}, {"es": "Clara quiere hacer zumo en casa.", "ru": "Клара хочет приготовить дома сок."}, {"es": "Pone todo en la bolsa y sale del mercado.", "ru": "Она кладёт всё в сумку и выходит с рынка."}, {"es": "Ahora la bolsa pesa mucho.", "ru": "Теперь сумка очень тяжёлая."}, {"es": "Clara camina despacio y para un momento en una plaza.", "ru": "Клара идёт медленно и ненадолго останавливается на площади."}, {"es": "Deja la bolsa en un banco.", "ru": "Она ставит сумку на скамейку."}, {"es": "Algunas naranjas salen de la bolsa y caen al suelo.", "ru": "Несколько апельсинов выкатываются из сумки и падают на землю."}, {"es": "Clara ve dos naranjas debajo del banco.", "ru": "К quiere volver el próximo sábado."], "ru": ["Хулия живёт в Валенсии. По субботам утром она не работает. Ей нравится читать, но дома очень шумно. Её брат слушает музыку, а у соседей есть собака.", "Сегодня Хулия хочет почитать новую книгу. Она кладёт книгу в рюкзак и выходит из дома. Рядом с площадью есть небольшая библиотека. Хулия решает пойти туда.", "Библиотека открыта. Хулия входит и смотрит на столы. Там есть студенты с книгами и компьютерами. Все сидят тихо.", "В глубине зала есть стол у окна. У него два стула и лампа. Один стул свободен. Хулия ставит рюкзак на пол и садится.", "Она открывает книгу и начинает читать. Книга простая, а история интересная. Хулия понимает почти все слова. Она читает одну страницу, затем другую.", "Через час Хулия смотрит в окно. На улице начинается дождь. У неё нет зонта, но сейчас ей не нужно выходить. Ей здесь очень хорошо.", "Хулия продолжает читать. Вскоре выходит солнце. Она убирает книгу и возвращается домой. Теперь она знает спокойное место для чтения и хочет вернуться в следующую субботу."], "vocab": [["el ruido", "шум"], ["la biblioteca", "библиотека"], ["estar abierto", "быть открытым"], ["al fondo", "в глубине, в конце"], ["junto a", "рядом с, у"], ["empezar a leer", "начинать читать"], ["entender", "понимать"], ["volver", "возвращаться"]], "full_text": {"es": "Julia vive en Valencia. Los sábados por la mañana no trabaja. Le gusta leer, pero en su casa hay mucho ruido. Su hermano escucha música y los vecinos tienen un perro.\n\nHoy Julia quiere leer un libro nuevo. Mete el libro en la mochila y sale de casa. Cerca de la plaza hay una biblioteca pequeña. Julia decide ir allí.\n\nLa biblioteca está abierta. Julia entra y mira las mesas. Hay estudiantes con libros y ordenadores. Todos están en silencio.\n\nAl fondo hay una mesa junto a una ventana. Tiene dos sillas y una lámpara. Una silla está libre. Julia deja la mochila en el suelo y se sienta.\n\nAbre el libro y empieza a leer. El libro es fácil y la historia es interesante. Julia entiende casi todas las palabras. Lee una página y después otra.\n\nDespués de una hora, Julia mira por la ventana. Fuera empieza a llover. No tiene paraguas, pero no necesita salir ahora. Está muy bien allí.\n\nJulia sigue leyendo. Poco después sale el sol. Guarda el libro y vuelve a casa. Ahora conoce un sitio tranquilo para leer y quiere volver el próximo sábado.", "ru": "Хулия живёт в Валенсии. По субботам утром она не работает. Ей нравится читать, но дома очень шумно. Её брат слушает музыку, а у соседей есть собака.\n\nСегодня Хулия хочет почитать новую книгу. Она кладёт книгу в рюкзак и выходит из дома. Рядом с площадью есть небольшая библиотека. Хулия решает пойти туда.\n\nБиблиотека открыта. Хулия входит и смотрит на столы. Там есть студенты с книгами и компьютерами. Все сидят тихо.\n\nВ глубине зала есть стол у окна. У него два стула и лампа. Один стул свободен. Хулия ставит рюкзак на пол и садится.\n\nОна открывает книгу и начинает читать. Книга простая, а история интересная. Хулия понимает почти все слова. Она читает одну страницу, затем другую.\n\nЧерез час Хулия смотрит в окно. На улице начинается дождь. У неё нет зонта, но сейчас ей не нужно выходить. Ей здесь очень хорошо.\n\nХулия продолжает читать. Вскоре выходит солнце. Она убирает книгу и возвращается домой. Теперь она знает спокойное место для чтения и хочет вернуться в следующую субботу."}, "sentences": [{"es": "Julia vive en Valencia.", "ru": "Хулия живёт в Валенсии."}, {"es": "Los sábados por la mañana no trabaja.", "ru": "По субботам утром она не работает."}, {"es": "Le gusta leer, pero en su casa hay mucho ruido.", "ru": "Ей нравится читать, но дома очень шумно."}, {"es": "Su hermano escucha música y los vecinos tienen un perro.", "ru": "Её брат слушает музыку, а у соседей есть собака."}, {"es": "Hoy Julia quiere leer un libro nuevo.", "ru": "Сегодня Хулия хочет почитать новую книгу."}, {"es": "Mete el libro en la mochila y sale de casa.", "ru": "Она кладёт книгу в рюкзак и выход {"src": "story_8.mp3", "available": true}}, {"id": "story-9", "title": "La ropa de Isabel", "level": "A1", "es": ["Esta noche, Isabel tiene una fiesta en casa de su prima. Todavía está en pijama y necesita cambiarse de ropa. Abre el armario y mira los vestidos. El vestido rojo es demasiado largo. El negro es más corto, pero está sucio. Isabel prefiere unos vaqueros y una camisa blanca. Se prueba los vaqueros. Le quedan bien y son cómodos. La camisa, en cambio, tiene una mancha. No pasa nada: tiene otra limpia. Es azul y le gusta más. Isabel se mira en el espejo. La camisa es un poco grande, pero con un cinturón queda mejor. Ya casi está lista. Solo faltan los zapatos. En vez de zapatos, elige unas zapatillas. No hace falta llevar ropa elegante. Lo importante es estar a gusto. Antes de salir, guarda un jersey en el bolso. Por la noche hace fresco. Por fin está lista. Hoy no necesita ropa nueva: con lo que tiene es suficiente."], "ru": ["Сегодня вечером у Исабель вечеринка дома у её двоюродной сестры. Она ещё в пижаме, и ей нужно переодеться. Она открывает шкаф и смотрит на платья. Красное платье слишком длинное. Чёрное короче, но оно грязное. Исабель предпочитает джинсы и белую рубашку. Она примеряет джинсы. Они ей впору и удобные. А вот на рубашке пятно. Ничего страшного: у неё есть другая, чистая. Она голубая и нравится ей больше. Исабель смотрит на себя в зеркало. Рубашка немного велика, но с ремнём смотрится лучше. Она уже почти готова. Не хватает только обуви. Вместо туфель она выбирает кроссовки. Необязательно надевать нарядную одежду. Главное — чувствовать себя комфортно. Перед выходом она кладёт джемпер в сумку. Вечером прохладно. Наконец она готова. Сегодня ей не нужна новая одежда: того, что у неё есть, достаточно."], "vocab": [["cambiarse de ropa", "переодеваться"], ["el armario", "шкаф"], ["demasiado largo", "слишком длинный"], ["los vaqueros", "джинсы"], ["probarse", "примерять"], ["quedar bien", "быть впору; хорошо смотреться"], ["No pasa nada.", "Ничег   main.innerHTML = stories.map((s,i) => {
    const dialogueTurns = {
      'story-2': [[7,8],[9,9],[10,11],[14,15],[16,16],[17,17],[21,22],[23,23],[24,25],[26,27],[28,28]],
      'story-3': [[3,3],[4,5],[11,11],[12,12],[13,13],[18,18],[19,21],[22,22],[26,26],[27,28]],

      'story-5': [[6,7],[8,8],[13,13],[21,22],[23,24],[25,26],[28,28],[29,29]]
    };
    const turns = s.dialogue_turns || dialogueTurns[s.id] || [];

    const sentenceHTML = index => {

      return `<span role="button" tabindex="0" class="sentence-toggle" lang="es-ES" data-translation="${escapeHTML(pair.ru)}" aria-expanded="false" aria-controls="${translationId}" title="Нажми, чтобы увидеть перевод">${escapeHTML(pair.es)}</span>`;
    };
    let cursor = 0, chunks = [];

      if (turn) {

function positionTranslation(sentence, translation) {

  const bounds = paragraph.getBoundingClientRect();
  const lines = sentence.getClientRects();
  const lastLine = lines[lines.length - 1];
  translation.style.top = `${lastLine.bottom - bounds.top + 6}px`;
  translation.style.left = '0px';
}

function renderNumbers() {
  stories.push({title:'Los números: 1–100', audio:{src:'numbers.mp3', available:true}});
  const first = ['uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];
  const tens = {30:'treinta',40:'cuarenta',50:'cincuenta',60:'sesenta',70:'setenta',80:'ochenta',90:'noventa'};
  const word = n => n === 100 ? 'cien' : n < 30 ? first[n-1] : tens[Math.floor(n/10)*10] + (n%10 ? ' y ' + first[n%10-1] : '');
  const groups = Array.from({length:10}, (_,group) => {
    const start = group*10+1;
    const rows = Array.from({length:10}, (_,offset) => {
      const n = start+offset;
      return `<tr><td>${n}</td><td lang="es-ES">${word(n)}</td></tr>`;
    }).join('');
    return `<div class="number-group"><table><caption>${start}–${start+9}</caption><thead><tr><th scope="col">ЧИСЛО</th><th scope="col">ESPAÑOL</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }).join('');
  main.insertAdjacentHTML('beforeend', `<article id="numbers"><div class="eyebrow">РАЗДЕЛ 01 · A1</div><h2 lang="es-ES">Los números: 1–100</h2><button class="story-play" type="button" data-story="${stories.length-1}" aria-label="Слушать числа">▶ Слушать числа</button><p class="numbers-intro">Числа от 1 до 100 · Цифра слева, написание по-испански справа.</p><div class="number-groups">${groups}</div></article>`);
  document.getElementById('story-nav').insertAdjacentHTML('beforeend', '<a href="#numbers"><span class="eyebrow">01 · A1</span><br><span lang="es-ES">Los números: 1–100</span></a>');
}

const sectionLinks = [...navigation.querySelectorAll('a[href^="#"]')];
const readingSections = [...main.querySelectorAll('article[id]')];
let currentSectionId = '';
let navigationScrollTarget = null;
let navigationScrollTimer;
function setCurrentSection(id) {
  if (id === currentSectionId) return;
  currentSectionId = id;
  sectionLinks.forEach(link => {
    if (link.hash === '#' + id) {
      link.setAttribute('aria-current', 'location');
      // Keep the active link visible within the sidebar without moving the page.
      const box = link.getBoundingClientRect();
      const panel = navigation.getBoundingClientRect();
      if (navigation.scrollHeight > navigation.clientHeight) {
        if (box.top < panel.top) navigation.scrollTop -= panel.top - box.top + 8;
        else if (box.bottom > panel.bottom) navigation.scrollTop += box.bottom - panel.bottom + 8;
      } else if (navigation.scrollWidth > navigation.clientWidth) {
        if (box.left < panel.left) navigation.scrollLeft -= panel.left - box.left + 8;
        else if (box.right > panel.right) navigation.scrollLeft += box.right - panel.right + 8;
      }
    } else link.removeAttribute('aria-current');
  });
}
function updateCurrentSection() {
  if (navigationScrollTarget) return;
  const readingLine = Math.min(window.innerHeight * 0.25, 180);
  let current = readingSections[0];
  for (const section of readingSections) {
    if (section.getBoundingClientRect().top <= readingLine) current = section;
    else break;
  }
  if (current) setCurrentSection(current.id);
}
let sectionUpdatePending = false;
window.addEventListener('scroll', () => {
  if (sectionUpdatePending) return;

  requestAnimationFrame(() => { updateCurrentSection(); sectionUpdatePending = false; });

  if (!navigationScrollTarget) return;

  clearTimeout(navigationScrollTimer);
}

  clearTimeout(navigationScrollTimer);
  navigationScrollTimer = setTimeout(finishNavigationScroll, 1600);
}));

// Fallback for browsers without scrollend support.
window.addEventListener('scroll', () => {
  if (!navigationScrollTarget) return;
  clearTimeout(navigationScrollTimer);
  navigationScrollTimer = setTimeout(finishNavigationScroll, 160);

function resumeManualTracking() {
  finishNavigationScroll();

}

 window.addEventListener('pageshow', refreshPlayerPosition);
 if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', refreshPlayerPosition);
  window.visualViewport.addEventListener('scroll', refreshPlayerPosition);
 }
 audio.addEventListener('play', refreshPlayerPosition);
 positionPlayer();
 const controls = document.createElement('div');
 controls.className = 'mobile-player';
 controls.innerHTML = `<div class="mobile-transport"><button type="button" class="mobile-back" aria-label="Назад на 3 секунды"><svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8a11 11 0 1 1-2 12"/><path d="M7 3v5h5"/></g><text x="16" y="20.5" text-anchor="middle" fill="currentColor" font-family="system-ui,sans-serif" font-size="13" font-weight="650">3</text></svg></button><button type="button" class="mobile-play" aria-label="Воспроизвести">▶</button><button type="button" class="mobile-forward" aria-label="Вперёд на 3 секунды"><svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true" focusable="false"><g transform="translate(32 0) scale(-1 1)" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8a11 11 0 1 1-2 12"/><path d="M7 3v5h5"/></g><text x="16" y="20.5" text-anchor="middle" fill="currentColor" font-family="system-ui,sans-serif" font-size="13" font-weight="650">3</text></svg></button></div><div class="mobile-seek-row"><span class="mobile-elapsed">0:00</span><input type="range" min="0" max="100" step="0.1" value="0" aria-label="Позиция воспроизведения" disabled><span class="mobile-duration">0:00</span></div>`;
 dock.append(controls);
 const play = controls.querySelector('.mobile-play');
 const seek = controls.querySelector('input');
 const elapsed = controls.querySelector('.mobile-elapsed');
 const duration = controls.querySelector('.mobile-duration');
 const format = value => { const seconds = Number.isFinite(value) ? Math.floor(value) : 0; return Math.floor(seconds / 60) + ':' + String(seconds % 60).padStart(2, '0'); };
 const refresh = () => {
  const ready = Number.isFinite(audio.duration) && audio.duration > 0;
  seek.disabled = !ready;
  seek.max = ready ? audio.duration : 100;
  seek.value = audio.currentTime || 0;
  seek.setAttribute('aria-valuetext', format(audio.currentTime) + ' / ' + format(audio.duration));
  elapsed.textContent = format(audio.currentTime);
  duration.textContent = format(audio.duration);
  play.textContent = audio.paused ? '▶' : 'Ⅱ';
  play.setAttribute('aria-label', audio.paused ? 'Воспроизвести' : 'Пауза');
 };
 play.addEventListener('click', () => {
  if (audio.paused) audio.play().catch(() => { document.getElementById('player-note').textContent = 'Не удалось включить аудио. Попробуй ещё раз.'; });
  else audio.pause();
 });
 const skip = seconds => { if (Number.isFinite(audio.duration)) audio.currentTime = Math.max(0, Math.min(audio.duration, audio.currentTime + seconds)); refresh(); };
 controls.querySelector('.mobile-back').addEventListener('click', () => skip(-3));
 controls.querySelector('.mobile-forward').addEventListener('click', () => skip(3));
 seek.addEventListener('input', () => { audio.currentTime = Number(seek.value); refresh(); });
 ['play','pause','ended','timeupdate','loadedmetadata','durationchange','emptied'].forEach(event => audio.addEventListener(event, refresh));
 refresh();
 dock.classList.add('mobile-ready');
})();
</script>
</body></html>
